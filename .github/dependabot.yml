version: 2

updates:
  # --- npm ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # zod 4 is a breaking major (schema + error-handling API changes) and zod
      # underpins every MCP tool / REST schema — upgrade it deliberately with a
      # migration and a test pass, not via an automatic Dependabot bump. Minor
      # and patch updates of zod still come through.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # --- Docker ---
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
    # Node MAJOR upgrades are a deliberate migration, not a weekly bump: the
    # image must stay on an LTS line aligned with engines.node and the SAP BTP
    # Node.js buildpack, and Dependabot can't tell LTS (even) majors from
    # short-lived Current (odd) ones — it proposed node 25, an already-EOL odd
    # release. Patch/minor updates of the base image still come through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
