name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Bundle with esbuild
        run: npm run bundle

      # Real check (replaces the old `node bundle/index.cjs || true` that could
      # never fail): the bundle must report the package.json version over MCP.
      - name: Verify the bundle reports the real version
        run: node scripts/check-bundle-version.mjs

      # Negative control: a bundle built WITHOUT the esbuild version define must
      # make the check fail — otherwise the check above proves nothing.
      - name: Negative control (bundle without the version define must fail)
        run: |
          npx esbuild dist/index.js --bundle --platform=node --target=node20 \
            --format=cjs --outfile=bundle/nodefine.cjs
          cp sap_abbreviation_dictionary.json bundle/sap_abbreviation_dictionary.json
          if node scripts/check-bundle-version.mjs bundle/nodefine.cjs; then
            echo "::error::negative control passed unexpectedly — the version check does not actually detect a missing define"
            exit 1
          fi
          echo "negative control OK — check correctly failed on the un-defined bundle"

  # Ship-guard: a PR that changes what ROSA ships must be releasable by
  # release-please (feat/fix/breaking), or carry the `no-release` label.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need base + head history for the diff and commit scan

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Require a releasable commit for shipped changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/require-release.mjs
        # require-release.mjs uses only Node builtins, so this job needs no
        # `npm ci`. The shipped-deps unit tests run in the `build` job's `npm test`.
