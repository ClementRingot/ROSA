_schema-version: "3.1"
ID: rosa
version: 1.14.1 # x-release-please-version

modules:
  - name: rosa
    type: nodejs
    path: .
    parameters:
      memory: 256M
      disk-quota: 512M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      NODE_ENV: production
      TRANSPORT: http
    build-parameters:
      builder: npm
      build-result: dist
    provides:
      - name: oauth-api
        properties:
          url: ${default-url}
    requires:
      - name: rosa-xsuaa

resources:
  - name: rosa-xsuaa
    type: org.cloudfoundry.managed-service
    requires:
      - name: oauth-api
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        oauth2-configuration:
          redirect-uris:
            - ~{oauth-api/url}/oauth/callback
